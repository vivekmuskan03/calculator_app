include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Enforce documentation comments on all public APIs
    public_member_api_docs: true
    # Prefer const constructors where possible
    prefer_const_constructors: true
    prefer_const_declarations: true
    # Avoid print statements in production code
    avoid_print: true
    # Require type annotations on public APIs
    always_declare_return_types: true
    # Prefer final for local variables
    prefer_final_locals: true
    # Avoid unnecessary null checks
    unnecessary_null_checks: true

analyzer:
  errors:
    # Treat missing return types as errors
    always_declare_return_types: error
    # Treat unused imports as warnings
    unused_import: warning
    # Treat dead code as warnings
    dead_code: warning
